name: PNPM Setup Action

inputs:
  NPM_READ_TOKEN:
    type: string
  NODE_VERSION:
    default: lts
    type: string

runs:
  using: composite
  steps:
    - name: configure npmAuthToken in ~/.npmrc if NPM_READ_TOKEN is provided
      if: ${{ inputs.NPM_READ_TOKEN != '' }}
      run: echo "//registry.npmjs.org/:_authToken=${{ inputs.NPM_READ_TOKEN }}" > ~/.npmrc
      shell: bash
    - name: Install pnpm and Node.js
      uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
      with:
        runtime: node@${{ inputs.NODE_VERSION }}
        cache: true
